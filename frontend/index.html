<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B4F8A" />

    <!-- SEO primaire -->
    <title>Adoptly — Trouvez votre animal idéal | Adoption responsable</title>
    <meta name="description" content="Adoptly connecte les futurs adoptants avec des animaux compatibles avec leur mode de vie. Découvrez des chiens, chats et autres animaux de refuge près de chez vous, sélectionnés par notre algorithme de compatibilité." />
    <meta name="keywords" content="adoption animale, adopter un chien, adopter un chat, refuge animal, adoption responsable, France, compatibilité animal" />
    <link rel="canonical" href="https://adoptly.fr" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Adoptly" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adoptly.fr" />
    <meta property="og:title" content="Adoptly — Découvrez votre animal idéal" />
    <meta property="og:description" content="Découvrez des animaux adaptés à votre mode de vie. Notre algorithme de compatibilité vous connecte avec des animaux de refuge qui vous correspondent réellement." />
    <meta property="og:image" content="https://adoptly.fr/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Adoptly" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adoptly — Trouvez votre animal idéal" />
    <meta name="twitter:description" content="Découvrez des animaux adaptés à votre mode de vie." />
    <meta name="twitter:image" content="https://adoptly.fr/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Adoptly" />

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "Adoptly",

      "description": "Plateforme de matching intelligent pour l'adoption animale responsable.",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      }
    }
    </script>
