# Adoptly — Configuration Netlify
# Déploiement: connecter le repo GitHub, puis pointer sur ce fichier

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Edge Function — OG tags dynamiques pour /animal/:id
# Intercepte les crawlers sociaux (Facebook, WhatsApp, Discord...)
# et leur renvoie un HTML avec les balises OG correctes
[[edge_functions]]
  function = "og-animal"
  path     = "/animal/*"

[build.environment]
  NODE_VERSION = "18"

# Redirige toutes les routes vers index.html (SPA React)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Headers de sécurité et performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker — ne JAMAIS mettre en cache (doit se mettre à jour à chaque déploiement)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# HTML — revalider à chaque visite pour servir le bon bundle JS
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
